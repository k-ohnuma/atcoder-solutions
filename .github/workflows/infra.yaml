name: CI for infra
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yaml"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yaml"
      - "flake.nix"
      - "flake.lock"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: CI
        run: nix develop .#infra -c bash -lc 'cd infra && pnpm install --frozen-lockfile && pnpm run ci'
